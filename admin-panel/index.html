<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Admin — Login</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f1117;
      --card:      #1a1d27;
      --border:    rgba(255,255,255,0.08);
      --accent:    #6366f1;
      --accent-dim: rgba(99,102,241,0.12);
      --text:      #e2e8f0;
      --muted:     #64748b;
      --error:     #f87171;
      --success:   #34d399;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }
    .login-header { text-align: center; margin-bottom: 40px; }
    .login-logo {
      width: 56px; height: 56px;
      background: var(--accent-dim);
      border: 1.5px solid rgba(99,102,241,0.35);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.5rem;
    }
    .login-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-sub { font-size: 0.85rem; color: var(--muted); }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.25s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: #3d4455; }
    .login-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
      font-family: inherit;
    }
    .login-btn:hover { background: #818cf8; transform: translateY(-1px); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg {
      color: var(--error);
      font-size: 0.82rem;
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }
    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .login-footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">⚙️</div>
      <h1 class="login-title">Admin Panel</h1>
      <p class="login-sub">Portfolio Management Dashboard</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email / Username</label>
        <input type="email" id="loginEmail" name="email" placeholder="admin@example.com" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
      <div class="error-msg" id="loginError"></div>
    </form>
    <div class="login-footer">
      <a href="http://localhost:3000">← Back to Portfolio</a>
    </div>
  </div>

  <div style="text-align:center;margin-top:16px;">
    <button id="toggleApiSettings" style="background:none;border:none;color:#64748b;font-size:0.75rem;cursor:pointer;text-decoration:underline;">
      API Endpoint: <span id="currentApiDisplay">...</span> (Change)
    </button>
    <div id="apiSettingsBox" style="display:none;margin-top:10px;padding:12px;background:#161b22;border:1px solid #30363d;border-radius:8px;max-width:380px;margin-left:auto;margin-right:auto;">
      <label style="display:block;font-size:0.75rem;color:#8b949e;margin-bottom:6px;text-align:left;">Backend API URL:</label>
      <input type="text" id="customApiUrl" placeholder="https://balavignesh-portfolio-api.onrender.com" style="width:100%;padding:8px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#e6edf3;font-size:0.8rem;margin-bottom:8px;outline:none;" />
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="resetApiBtn" type="button" style="padding:4px 10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;font-size:0.75rem;cursor:pointer;">Reset Default</button>
        <button id="saveApiBtn" type="button" style="padding:4px 10px;background:#10b981;color:#000;border:none;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script>
    const API_BASE = (window.PORTFOLIO_CONFIG && window.PORTFOLIO_CONFIG.API_BASE) || 'http://localhost:8000';
    
    // API endpoint UI toggle
    const apiDisplay = document.getElementById('currentApiDisplay');
    const apiBox = document.getElementById('apiSettingsBox');
    const customApiInput = document.getElementById('customApiUrl');
    if (apiDisplay) apiDisplay.textContent = API_BASE;
    if (customApiInput) customApiInput.value = API_BASE;

    document.getElementById('toggleApiSettings')?.addEventListener('click', () => {
      apiBox.style.display = apiBox.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('saveApiBtn')?.addEventListener('click', () => {
      const val = customApiInput.value.trim();
      if (val && window.PORTFOLIO_CONFIG) {
        window.PORTFOLIO_CONFIG.setApiBase(val);
      }
    });

    document.getElementById('resetApiBtn')?.addEventListener('click', () => {
      if (window.PORTFOLIO_CONFIG) {
        window.PORTFOLIO_CONFIG.resetApiBase();
      }
    });

    const form  = document.getElementById('loginForm');
    const btn   = document.getElementById('loginBtn');
    const error = document.getElementById('loginError');

    // redirect if already authenticated
    if (localStorage.getItem('admin_token')) {
      window.location.href = 'dashboard.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        error.textContent = 'Please enter both email and password.';
        return;
      }

      btn.disabled   = true;
      btn.textContent = 'Signing in...';
      error.textContent = '';

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok && data.access_token) {
          localStorage.setItem('admin_token', data.access_token);
          localStorage.setItem('admin_email', email);
          window.location.href = 'dashboard.html';
        } else {
          error.textContent = data.detail || 'Invalid credentials. Please try again.';
        }
      } catch {
        error.textContent = '⚠️ Cannot connect to backend. Make sure the server is running at ' + API_BASE;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
