services:
  - type: web
    name: balavignesh-portfolio-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ADMIN_EMAIL
        value: admin@balavignesh.dev
      - key: ADMIN_PASSWORD
        value: Balavignesh@2026
      - key: DATABASE_URL
        fromDatabase:
          name: balavignesh-portfolio-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: UPLOAD_DIR
        value: uploads
    disk:
      name: portfolio-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: balavignesh-portfolio-db
    plan: free
    region: oregon
    databaseName: portfolio_db
    user: balavignesh
